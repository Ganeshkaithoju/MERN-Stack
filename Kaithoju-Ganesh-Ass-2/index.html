<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Laundry wala is a website which helps in book multiple services related to the laundry. Where we are also offering the long term contracts and door step delivery.">
    <title>Laundry Wala Services</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            
            <nav class="navbar">

                <div class="logo">
                    <img src="images/logo.png" alt="Logo">
                </div>

                <!-- Hamburger checkbox -->
                <input type="checkbox" id="menu-checkbox" class="menu-checkbox">

                <!-- Three-line hamburger icon -->
                <label for="menu-checkbox" class="menu-toggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>

                <ul class="navlinks">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#services">Services</a></li>
                    <li><a href="#about">About Us</a></li>
                    <li><a href="#contact">Contact Us</a></li>
                </ul>

                <div class="user">
                    <p>Username</p>
                </div>

            </nav>

        </div>
    </header>
    <main id="home">
        <div class="hero">
            <div class="leftDev">
                <h1 id="hero-title">
                    Revitalize Your Clothes with Expert
                    <span>Laundry Services!</span>
                </h1>
                <p>
                    From premium dry cleaning to swift wash and fold, we deliver care and convenience. Schedule a pickup and rediscover the freshness of your clothes today!
                </p>
                <button type="button" id="bookBtn">Book a service today!</button>
            </div>
            <div class="rightDev">
                <img src="images/hero.png" alt="Commercial laundry machines and washing services">
            </div>
        </div>
